[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragretriever"
version = "0.1.0"
description = "Standalone MCP retriever service for RAG (rag.search)"
requires-python = ">=3.10"
dependencies = [
  "uvicorn[standard]",
  "starlette>=0.37",
  "mcp>=1.2.0",          # official MCP SDK
  "pyyaml>=6.0",         # used by your config.py
  # Your storage backends depend on these; keep them if your adapters need them:
  "langchain>=0.2.0",
  "langchain-community>=0.2.0",
  "psycopg2-binary>=2.9.9",  # PGVector adapter
  "pymilvus>=2.4.0",         # Milvus adapter
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ragretriever*"]
